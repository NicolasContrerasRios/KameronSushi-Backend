name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Restore
        run: dotnet restore KameronSushi.Backend.slnx
      - name: Build
        run: dotnet build KameronSushi.Backend.slnx --configuration Release --no-restore
      - name: Test
        run: dotnet test KameronSushi.Backend.slnx --configuration Release --no-build
